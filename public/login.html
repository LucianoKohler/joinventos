<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Tailwind CDN -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Joinventos</title>
</head>
<body>
    <header>
        <h3>JOINVENTOS</h3>
        <i data-lucide="wind" color="white" width="48px" height="48px"></i>
    </header>

    <main class="flex items-center">
        <div id="login" class="rounded-lg shadow-lg flex flex-col p-8! items-center gap-2 w-md max-w-[90vw] m-auto">
            <div class="logo flex items-center gap-2">
                <h3 class="font-bold text-sky-500 text-2xl!">JOINVENTOS</h3>
                <i data-lucide="wind" color="#0ea5e9" width="48px" height="48px"></i>
            </div>

            <form action="" class="flex flex-col gap-2" id="formLogin">
                <div>
                    <label for="email">E-MAIL</label><br>
                    <input type="text" name="email" id="email"><br>
                </div>
                <div>
                    <label for="senha">SENHA</label><br>
                    <input type="password" name="senha" id="senha"><br>
                </div>
                <button type="submit" class="mt-2">CADASTRAR</button>
                <i><a href="/cadastro.html">Não tem uma conta? Clique para cadastrar</a></i>
            </form>

        </div>
    </main>

    <footer>
        <p>JOINVENTOS BRASIL &#169 TODOS OS DIREITOS RESERVADOS</p>
    </footer>

    <!-- Lucide CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="js/login.js"></script>
</body>
</html>
