<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Tailwind CDN -->
    <link rel="stylesheet" href="css/evento.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Joinventos</title>
</head>
<body>
    <header>
        <div class="flex items-center gap-2">
            <h3>JOINVENTOS</h3>
            <i data-lucide="wind" color="white" width="48px" height="48px"></i>
        </div>
        <button onclick="window.location.href='./login.html'; localStorage.removeItem('token')" class="flex items-center gap-2 cursor-pointer">
            <p class="text-white">LOGOUT</p>
            <i data-lucide="log-out" stroke-width="3px" color="white"></i>
        </button>
    </header>

    <main>
        <div id="mainDiv" class="shadow-2xl">
            <h1 id="nomeEvento"></h1>
            <hr>
            <span class="badge" id="categoriaEvento"></span>
            <span class="badge" id="statusEvento"></span >
            <i id="descricaoEvento"></i>
            <hr>
            <h2>HORÁRIO</h2>
            <div class="horario">
                <b>Início:</b> 
                <p id="dataInicio"></p>
                às
                <p id="horarioInicio"></p>
                <div class="break"></div>
                <b>Término:</b> 
                <p id="dataTermino"></p>
                às
                <p id="horarioTermino"></p>
            </div>
            <hr>
            <h2>LOCALIZAÇÃO</h2>
            <div class="localizacao">
                <b id="nomeLocal"></b>
                <b>Endereço:</b> <p id="enderecoLocal"></p>
                <div class="break"></div>
                <b>Infraestrutura:</b> <p id="infraLocal"></p>
            </div>
            <hr>
            <h2>OUTRAS INFORMAÇÕES</h2>
            <div class="outros">
                <b>Preço do ingresso:</b> <p id="valorIngresso"></p>
                <div class="break"></div>
                <b>Organizadora:</b> <p id="nomeOrganizador"></p>
            </div>
        </div>
        <aside class="shadow-2xl">
            <div id="cadastrado">
                <h1>VOCÊ ESTÁ CADASTRADO NESTE EVENTO</h1>
                <div class="buttons">
                    <button id="cancelar" class="vermelho" onclick="cancelarIngresso()">
                        <i data-lucide="circle-x"></i>Sair do evento
                    </button>
                    <button id="confirmar" class="verde" onclick="confirmarPresenca()">
                        <i data-lucide="circle-check"></i>Confirmar presença
                    </button>
                </div>
            </div>
            <div id="nao-cadastrado">
                <h1>VOCÊ NÃO ESTÁ CADASTRADO NESTE EVENTO</h1>
                <div class="buttons">
                    <button class="verde" onclick="entrarEvento()">
                        <i data-lucide="circle-check"></i>Entrar no evento
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <footer>
        <p>JOINVENTOS BRASIL &#169 TODOS OS DIREITOS RESERVADOS</p>
    </footer>
    <!-- Lucide CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="js/eventoParticipante.js"></script>
</body>
</html>
