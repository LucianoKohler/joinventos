<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Tailwind CDN -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Joinventos</title>
</head>
<body>
    <header>
        <div class="flex items-center gap-2">
            <h3>JOINVENTOS</h3>
            <i data-lucide="wind" color="white" width="48px" height="48px"></i>
        </div>
        <button onclick="window.location.href='./fornecedores.html'">
            <p class="text-white">VOLTAR</p>
            <i data-lucide="arrow-left" stroke-width="3px" color="white"></i>
        </button>
    </header>

    <main>
        <div id="login" class="rounded-lg shadow-lg flex flex-col p-8! items-center gap-2 w-md max-w-[90vw] m-auto">
            <div class="logo flex items-center gap-2">
                <h3 class="font-bold text-sky-500 text-2xl!">NOVO FORNECEDOR</h3>
                <i data-lucide="user-plus" color="#0ea5e9" width="40px" height="40px"></i>
            </div>

            <form id="formCriarFornecedor" class="flex flex-col gap-2 w-full">
                <div>
                    <label for="nome">NOME DO FORNECEDOR</label><br>
                    <input type="text" name="nome" id="nome" required class="w-full"><br>
                </div>

                <div>
                    <label for="cnpj">CNPJ</label><br>
                    <input type="text" name="cnpj" id="cnpj" placeholder="00.000.000/0000-00" required class="w-full"><br>
                </div>

                <div class="flex gap-2">
                    <div class="flex-1">
                        <label for="telefone">TELEFONE</label><br>
                        <input type="text" name="telefone" id="telefone" required class="w-full"><br>
                    </div>
                    <div class="flex-1">
                        <label for="avalDesempenho">AVALIAÇÃO (0.0 a 10.0)</label><br>
                        <input type="number" step="0.1" min="0" max="10" name="avalDesempenho" id="avalDesempenho" class="w-full"><br>
                    </div>
                </div>

                <div>
                    <label for="especialidade">ESPECIALIDADE</label><br>
                    <input type="text" name="especialidade" id="especialidade" placeholder="Ex: Buffet, Som, Iluminação" class="w-full"><br>
                </div>

                <div>
                    <label for="email">E-MAIL</label><br>
                    <input type="email" name="email" id="email" class="w-full"><br>
                </div>

                <button type="submit" class="mt-2 cursor-pointer">CADASTRAR FORNECEDOR</button>
                <i><a href="./fornecedores.html">Voltar para fornecedores</a></i>
            </form>
        </div>
    </main>

    <footer>
        <p>JOINVENTOS BRASIL &#169 TODOS OS DIREITOS RESERVADOS</p>
    </footer>

    <!-- Lucide CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="js/criarFornecedor.js"></script>
</body>
</html>
