<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Tailwind CDN -->
    <link rel="stylesheet" href="css/localizacoes.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Joinventos</title>
</head>
<body>
    <header>
        <div class="flex items-center gap-2">
            <h3>JOINVENTOS</h3>
            <i data-lucide="wind" color="white" width="48px" height="48px"></i>
        </div>
        <button onclick="window.location.href='./homeAdm.html'">
            <p class="text-white">VOLTAR</p>
            <i data-lucide="arrow-left" stroke-width="3px" color="white"></i>
        </button>
    </header>
    
    <main class="flex flex-col p-6 relative min-h-[80vh]">
        <h1>APRESENTADORES CADASTRADOS</h1>
        <hr class="mb-4!">
        
        <!-- Container onde os cards serão injetados -->
        <div class="flex flex-wrap gap-4" id="mainContent">
            <p class="sem-eventos">Carregando apresentadores...</p>
        </div>

        <!-- Botão Flutuante (+) no canto inferior direito -->
        <button id="adicionar" onclick="window.location.href='./criarApresentador.html'" class="shadow-2xl cursor-pointer">
            <i data-lucide="plus" color="white" width="32px" height="32px"></i>
        </button>
    </main>
    
    <footer>
        <p>JOINVENTOS BRASIL &#169 TODOS OS DIREITOS RESERVADOS</p>
    </footer>

    <!-- Lucide CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="js/apresentadores.js"></script>
</body>
</html>
